# Builds natizap for Linux, Windows and macOS, on x86-64 and ARM64, when a
# version tag is pushed, and publishes the packages, with their checksums,
# as a GitHub release. The in-app updater (natizap-update) reads that
# release: keep the file names' endings as they are.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run by hand (workflow_dispatch), it builds and packages every platform
# from the branch without publishing: the packages stay as the run's
# artifacts, a dry run before tagging.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      # Each build stands alone: one failing should not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # `arch` is how files are named; `package` is nfpm's (and Debian's)
          # name for it.
          - arch: x86_64
            package: amd64
            runner: ubuntu-22.04
          - arch: aarch64
            package: arm64
            runner: ubuntu-22.04-arm
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nasm clang libclang-dev pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev \
            libzstd-dev libpipewire-0.3-dev nfpm

      # The runner's preinstalled Rust can trail the one the workspace needs.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # FFmpeg is built once per cache; a new key rebuilds it, as after
          # its compiler flags change in .cargo/config.toml.
          key: ffmpeg-portable

      - name: Build
        run: cargo build --release --locked -p natizap

      - name: Package
        env:
          NATIZAP_VERSION: ${{ steps.version.outputs.version }}
          NATIZAP_ARCH: ${{ matrix.package }}
          ARCH: ${{ matrix.arch }}
        run: |
          version="$NATIZAP_VERSION"
          mkdir -p dist
          for packager in deb:deb rpm:rpm archlinux:pacman; do
            echo "${packager#*:}" > target/install-kind
            nfpm package -f packaging/linux/nfpm.yaml -p "${packager%%:*}" -t dist/
          done
          # A package that lost the binary is a few kilobytes.
          for package in dist/*.deb dist/*.rpm dist/*.pkg.tar.zst; do
            if [ "$(stat -c %s "$package")" -lt 1000000 ]; then
              echo "$package is too small to hold natizap" >&2
              exit 1
            fi
          done

          # AppImage: the binary, its desktop entry and icon.
          appdir="$RUNNER_TEMP/natizap.AppDir"
          install -Dm755 target/release/natizap "$appdir/usr/bin/natizap"
          install -Dm755 packaging/linux/AppRun "$appdir/AppRun"
          install -Dm644 packaging/linux/natizap.desktop "$appdir/natizap.desktop"
          install -Dm644 brand/natizap-icon.png "$appdir/natizap.png"
          install -Dm644 brand/natizap-icon.png \
            "$appdir/usr/share/icons/hicolor/512x512/apps/natizap.png"
          curl -sSLo "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$ARCH.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"
          "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$appdir" "dist/natizap-$version-$ARCH.AppImage"

          # A plain archive, for unpacking anywhere.
          archive="$RUNNER_TEMP/natizap-$version"
          install -Dm755 target/release/natizap "$archive/natizap"
          install -Dm644 packaging/linux/natizap.desktop "$archive/natizap.desktop"
          install -Dm644 brand/natizap-icon.png "$archive/natizap.png"
          install -Dm644 LICENSE "$archive/LICENSE"
          tar -C "$RUNNER_TEMP" -czf "dist/natizap-$version-$ARCH-linux.tar.gz" "natizap-$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  windows:
    strategy:
      # Each build stands alone: one failing should not cancel the rest.
      fail-fast: false
      matrix:
        include:
          # `carch` is how FFmpeg's configure names it: MSYS2 runs emulated
          # on ARM64 and would otherwise report x86_64.
          - arch: x86_64
            msvc: x64
            carch: x86_64
            runner: windows-2022
          - arch: arm64
            msvc: arm64
            carch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # FFmpeg's configure script needs a POSIX shell and make (from the
      # runner's MSYS2), the MSVC compiler, and nasm on x86-64 or
      # gas-preprocessor (a Perl script) on ARM64 for its assembly. bindgen
      # needs LLVM, and packaging Inno Setup.
      - name: Install build dependencies
        shell: pwsh
        run: |
          if (-not (Test-Path C:\msys64)) { choco install msys2 -y --no-progress }
          if (-not (Test-Path "C:\Program Files\LLVM")) { choco install llvm -y --no-progress }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6")) { choco install innosetup -y --no-progress }
          if ("${{ matrix.arch }}" -eq "x86_64") {
            # From MSYS2, which the build runs under anyway.
            C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed nasm
          } else {
            $tools = "$env:RUNNER_TEMP\tools"
            New-Item -ItemType Directory -Force $tools | Out-Null
            Invoke-WebRequest https://raw.githubusercontent.com/FFmpeg/gas-preprocessor/master/gas-preprocessor.pl -OutFile "$tools\gas-preprocessor.pl"
            $tools | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make diffutils perl
          # MSYS2's coreutils `link` shadows MSVC's linker inside `sh`, and
          # configure then finds a compiler that cannot link anything.
          Remove-Item C:\msys64\usr\bin\link.exe
          # Installers can fail quietly (a package feed timing out): a missing
          # tool fails here instead of deep inside FFmpeg's configure.
          $needed = @("C:\msys64\usr\bin\make.exe", "C:\msys64\usr\bin\perl.exe",
            "C:\Program Files\LLVM\bin\libclang.dll", "C:\Program Files (x86)\Inno Setup 6\iscc.exe")
          if ("${{ matrix.arch }}" -eq "x86_64") { $needed += "C:\msys64\usr\bin\nasm.exe" }
          foreach ($tool in $needed) {
            if (-not (Test-Path $tool)) { throw "missing $tool" }
          }
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # FFmpeg is built once per cache; a new key rebuilds it, as after
          # its compiler flags change in .cargo/config.toml.
          key: ffmpeg-portable

      - name: Build
        shell: pwsh
        env:
          MSYSTEM_CARCH: ${{ matrix.carch }}
        run: |
          # MSYS2's sh first: Git for Windows' own sh is on PATH too, and its
          # tools shadow MSVC's linker the same way.
          $env:PATH = "C:\msys64\usr\bin;$env:PATH"
          cargo build --release --locked -p natizap

      - name: Show why FFmpeg's configure failed
        if: failure()
        shell: bash
        run: |
          find target -path '*ffbuild/config.log' -exec tail -n 60 {} \;
          where link || true

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('brand/natizap-icon.png').save('packaging/windows/natizap.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DVersion=$version" "/DArch=${{ matrix.arch }}" packaging\windows\natizap.iss
          Compress-Archive -Path target\release\natizap.exe, LICENSE `
            -DestinationPath "dist\natizap-$version-${{ matrix.arch }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*

  macos:
    strategy:
      # Each build stands alone: one failing should not cancel the rest.
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      # The oldest macOS natizap runs on, as packaging/macos/Info.plist says.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: |
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $declared" >&2
            exit 1
          fi
          echo "version=$declared" >> "$GITHUB_OUTPUT"

      # FFmpeg's x86 assembly needs nasm; Xcode brings the rest, libclang
      # for bindgen and the Metal compiler for GPUI's shaders included.
      - name: Install build dependencies
        run: brew install nasm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # FFmpeg is built once per cache; a new key rebuilds it, as after
          # its compiler flags change in .cargo/config.toml.
          key: ffmpeg-portable

      - name: Build
        run: cargo build --release --locked -p natizap

      - name: Package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          # natizap.app, beside a link to Applications to drag it onto.
          stage="$RUNNER_TEMP/dmg"
          app="$stage/natizap.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          install -m755 target/release/natizap "$app/Contents/MacOS/natizap"
          sed "s/VERSION/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # The brand icon is 512 pixels: every size up to it, none blown up.
          iconset="$RUNNER_TEMP/natizap.iconset"
          mkdir -p "$iconset"
          for side in 16 32 128 256 512; do
            sips -z "$side" "$side" brand/natizap-icon.png --out "$iconset/icon_${side}x${side}.png" > /dev/null
          done
          for side in 16 32 128 256; do
            double=$((side * 2))
            sips -z "$double" "$double" brand/natizap-icon.png --out "$iconset/icon_${side}x${side}@2x.png" > /dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/natizap.icns"
          # Ad hoc, without a Developer ID: Apple Silicon runs nothing
          # unsigned, and Gatekeeper asks the user once to open it anyway.
          codesign --force --deep --sign - "$app"
          codesign --verify --strict "$app"
          ln -s /Applications "$stage/Applications"
          mkdir -p dist
          dmg="dist/natizap-$VERSION-$ARCH-macos.dmg"
          hdiutil create -volname natizap -srcfolder "$stage" -ov -format UDZO "$dmg"
          # A package that lost the binary is a few kilobytes.
          if [ "$(stat -f %z "$dmg")" -lt 1000000 ]; then
            echo "$dmg is too small to hold natizap" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  publish:
    needs: [linux, windows, macos]
    # A run by hand stops at the artifacts.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
