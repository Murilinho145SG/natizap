# Builds natizap for Linux and Windows when a version tag is pushed, and
# publishes the packages, with their checksums, as a GitHub release. The
# in-app updater (natizap-update) reads that release: keep the file names'
# endings as they are.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          declared="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$version" != "$declared" ]; then
            echo "tag $GITHUB_REF_NAME does not match the workspace version $declared" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' \
            | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nasm clang libclang-dev pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev \
            libzstd-dev nfpm

      # The runner's preinstalled stable can trail the one the workspace needs.
      - name: Update Rust
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p natizap

      - name: Package
        env:
          NATIZAP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="$NATIZAP_VERSION"
          mkdir -p dist
          for packager in deb rpm archlinux; do
            nfpm package -f packaging/linux/nfpm.yaml -p "$packager" -t dist/
          done

          # AppImage: the binary, its desktop entry and icon.
          appdir="$RUNNER_TEMP/natizap.AppDir"
          install -Dm755 target/release/natizap "$appdir/usr/bin/natizap"
          install -Dm755 packaging/linux/AppRun "$appdir/AppRun"
          install -Dm644 packaging/linux/natizap.desktop "$appdir/natizap.desktop"
          install -Dm644 brand/natizap-icon.png "$appdir/natizap.png"
          install -Dm644 brand/natizap-icon.png \
            "$appdir/usr/share/icons/hicolor/512x512/apps/natizap.png"
          curl -sSLo "$RUNNER_TEMP/appimagetool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/appimagetool"
          ARCH=x86_64 "$RUNNER_TEMP/appimagetool" --appimage-extract-and-run \
            "$appdir" "dist/natizap-$version-x86_64.AppImage"

          # A plain archive, for unpacking anywhere.
          archive="$RUNNER_TEMP/natizap-$version"
          install -Dm755 target/release/natizap "$archive/natizap"
          install -Dm644 packaging/linux/natizap.desktop "$archive/natizap.desktop"
          install -Dm644 brand/natizap-icon.png "$archive/natizap.png"
          install -Dm644 LICENSE "$archive/LICENSE"
          tar -C "$RUNNER_TEMP" -czf "dist/natizap-$version-x86_64-linux.tar.gz" "natizap-$version"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # FFmpeg's configure script needs a POSIX shell and make (from the
      # runner's MSYS2), nasm, and the MSVC compiler.
      - name: Install build dependencies
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed make diffutils
          # MSYS2's coreutils `link` shadows MSVC's linker inside `sh`, and
          # configure then finds a compiler that cannot link anything.
          Remove-Item C:\msys64\usr\bin\link.exe
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Update Rust
        run: rustup update stable --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:PATH;C:\msys64\usr\bin"
          cargo build --release --locked -p natizap

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          python -m pip install --quiet pillow
          python -c "from PIL import Image; Image.open('brand/natizap-icon.png').save('packaging/windows/natizap.ico', sizes=[(s, s) for s in (16, 24, 32, 48, 64, 128, 256)])"
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" "/DVersion=$version" packaging\windows\natizap.iss
          Compress-Archive -Path target\release\natizap.exe, LICENSE `
            -DestinationPath "dist\natizap-$version-x86_64-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
