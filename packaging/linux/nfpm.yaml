# Builds the .deb, .rpm and Arch packages from a release build:
#   echo deb > target/install-kind
#   NATIZAP_VERSION=0.1.0 NATIZAP_ARCH=amd64 nfpm package -f packaging/linux/nfpm.yaml -p deb
# Paths are relative to the repository root, where nfpm runs.
name: natizap
# Debian's name: amd64 or arm64; nfpm renames it for rpm and Arch.
arch: ${NATIZAP_ARCH}
platform: linux
version: ${NATIZAP_VERSION}
release: 1
section: net
priority: optional
maintainer: Murillo Deolino <88172584+Murilinho145SG@users.noreply.github.com>
description: |
  A native desktop WhatsApp client, written in Rust with GPUI.
  Links to the phone as a companion device and speaks the WhatsApp
  multi-device protocol directly; keys and history stay on the machine.
vendor: natizap
homepage: https://github.com/Murilinho145SG/natizap
license: AGPL-3.0-or-later

contents:
  - src: target/release/natizap
    dst: /usr/bin/natizap
    file_info:
      mode: 0755
  - src: packaging/linux/natizap.desktop
    dst: /usr/share/applications/natizap.desktop
  - src: brand/natizap-icon.png
    dst: /usr/share/icons/hicolor/512x512/apps/natizap.png
  - src: LICENSE
    dst: /usr/share/licenses/natizap/LICENSE
  # Tells the in-app updater (natizap-update) which package manager installs
  # the next version. The release workflow writes the package's kind here
  # before building each one: contents set under `overrides` would replace
  # this whole list, not add to it.
  - src: target/install-kind
    dst: /usr/lib/natizap/install-kind

overrides:
  deb:
    depends:
      - libasound2t64 | libasound2
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb1
      - libvulkan1
      - libwayland-client0
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
  rpm:
    depends:
      - alsa-lib
      - libxkbcommon
      - libxkbcommon-x11
      - libxcb
      - vulkan-loader
      - libwayland-client
      - pipewire-libs
  archlinux:
    depends:
      - alsa-lib
      - libxkbcommon-x11
      - libxcb
      - vulkan-icd-loader
      - libpipewire
      - wayland

rpm:
  group: Applications/Internet
