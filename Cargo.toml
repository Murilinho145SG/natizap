[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["patches/*"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.100"
publish = false
license = "AGPL-3.0-or-later"
repository = "https://github.com/Murilinho145SG/natizap"

[workspace.dependencies]
# GPUI is not released on a stable cadence; pin Zed to a known-good commit.
gpui = { git = "https://github.com/zed-industries/zed", rev = "482e76524bd33d8cbdfc352f1fef3eefbf2fad92" }
# Without a display backend feature GPUI silently runs headless on Linux.
# `font-kit` lets macOS load the bundled fonts, as Zed does.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "482e76524bd33d8cbdfc352f1fef3eefbf2fad92", features = [
    "font-kit",
    "wayland",
    "x11",
] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "482e76524bd33d8cbdfc352f1fef3eefbf2fad92" }
# Pinned to a commit of main: the 0.7.0 release drops a phone's voice in a
# video call, which it sends inside its video packets (upstream #1720).
# Default features minus `signal` (the GUI owns shutdown), plus calls with
# the pure-Rust MLOW voice codec over the native relay.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "3f6982dc025ccc3e6e64843f85976d5e89b467ee", default-features = false, features = [
    "sqlite-storage",
    "tokio-native",
    "tokio-runtime",
    "tokio-transport",
    "ureq-client",
    "voip-mlow",
    "voip-relay-native",
] }

anyhow = "1"
# A sticker's identity in WhatsApp's app state is its hash in base64.
base64 = "0.22"
# Sound through the system sound server: PulseAudio's protocol, spoken in
# pure Rust, which PipeWire answers too, so devices show by the names the
# desktop gives them; ALSA where there is no server.
cpal = { version = "0.18", features = ["pulseaudio"] }
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
# FFmpeg compiled from source and linked statically: natizap decodes media
# itself instead of relying on system libraries or players. Needs nasm and
# libclang at build time.
emojis = "0.9"
ffmpeg-next = { version = "9.1", default-features = false, features = [
    "build",
    "codec",
    # The camera, for video calls.
    "device",
    "filter",
    "format",
    "software-resampling",
    "software-scaling",
] }
futures = "0.3"
# Encodes a call's camera as H.264 (Constrained Baseline, what WhatsApp
# sends), built from Cisco's source: FFmpeg has no H.264 encoder of its own.
openh264 = "0.9"
# Screen sharing on Linux: the desktop portal asks the user what to share
# (ashpd), and the pictures come over PipeWire, read through libpipewire as
# browsers and OBS read them; FFmpeg has no PipeWire input.
ashpd = { version = "0.14", default-features = false, features = ["async-io", "screencast"] }
pipewire = "0.10"
xcap = { version = "0.9", default-features = false }
# Cleans a call's microphone: echo cancelling (AEC3), noise suppression and
# gain control, WebRTC's audio processing ported to Rust.
sonora = "0.3"
# The tray icon on Linux: a StatusNotifierItem over D-Bus, in pure Rust.
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
# Must match the version GPUI uses for RenderImage frames.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
phonenumber = "0.3"
# Must share libsqlite3-sys with whatsapp-rust's SQLite store.
rusqlite = "0.39"
# Reads which natizap release is the newest.
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks a downloaded update against the release's checksums.
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["fs"] }
tracing = "0.1"
# The tray icon on Windows and macOS: a notification-area icon or menu bar
# extra, and its menu.
tray-icon = { version = "0.26", default-features = false }
unicode-segmentation = "1"
# Already in the tree through whatsapp-rust; fetches releases over rustls.
ureq = { version = "3", default-features = false, features = ["rustls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

natizap-calls = { path = "crates/natizap-calls" }
natizap-chats = { path = "crates/natizap-chats" }
natizap-contacts = { path = "crates/natizap-contacts" }
natizap-messages = { path = "crates/natizap-messages" }
natizap-notifications = { path = "crates/natizap-notifications" }
natizap-outbox = { path = "crates/natizap-outbox" }
natizap-playback = { path = "crates/natizap-playback" }
natizap-profiles = { path = "crates/natizap-profiles" }
natizap-launcher = { path = "crates/natizap-launcher" }
natizap-tray = { path = "crates/natizap-tray" }
natizap-player = { path = "crates/natizap-player" }
natizap-protocol = { path = "crates/natizap-protocol" }
natizap-ui = { path = "crates/natizap-ui" }
natizap-session = { path = "crates/natizap-session" }
natizap-status = { path = "crates/natizap-status" }
natizap-themes = { path = "crates/natizap-themes" }
natizap-stickers = { path = "crates/natizap-stickers" }
natizap-update = { path = "crates/natizap-update" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "warn"
print_stderr = "warn"
module_name_repetitions = "allow"

# Mirror the patches Zed applies to GPUI's dependencies at the pinned commit;
# without them GPUI builds against upstream versions it does not expect.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task", rev = "41fd3359c75e221bd8b187a8ee361aa309c1714c" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

# Skips app state patches already applied instead of failing on them; see
# patches/README.md. Drop when whatsapp-rust ships the fix.
[patch."https://github.com/oxidezap/whatsapp-rust"]
wacore-appstate = { path = "patches/wacore-appstate" }

[profile.release]
lto = "thin"
codegen-units = 1
# Symbols triple the download; releases are not debugged from the binary.
strip = true
